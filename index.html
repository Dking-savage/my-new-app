<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Interactive Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <h1>🚀 Dking ChronoList</h1>
    <div id="clock">Loading time...</div>

    <div class="input-group">
      <input type="text" id="taskInput" placeholder="Add a new task...">
      <button onclick="addTask()">Add</button>
    </div>

    <!-- Filter Tabs -->
    <div class="filter-group">
      <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
      <button class="filter-btn" onclick="setFilter('active', this)">Active</button>
      <button class="filter-btn" onclick="setFilter('completed', this)">Completed</button>
    </div>

    <div id="taskCounter">0 items remaining</div>

    <ul id="taskList"></ul>

    <button id="clearBtn" onclick="clearAllTasks()">Clear All Tasks</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
